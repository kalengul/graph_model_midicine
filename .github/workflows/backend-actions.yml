name: Backend CI

on:
  push:
    branches: [deploy]
    paths:
      - 'backend/**'
  pull_request:
    branches: [deploy]
    paths:
      - 'backend/**'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-django psycopg2-binary
          pip install -r requirements.txt

      - name: Run tests with PostgreSQL
        working-directory: ./backend
        env:
          USE_SQLITE: 'False'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          SECRET_KEY: 'GHA-test'
          DEBUG: 'True'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
          DJANGO_SETTINGS_MODULE: ml_pharm_web.settings
        run: |
          pytest

  build-backend:
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push' && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend Docker image
        run: |
          docker build -t backend-test-image ./backend
