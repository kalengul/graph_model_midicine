services:

  db:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - app_network

  backend:
    build: 
      context: ./backend
      args:
        - GIT_COMMIT_HASH=${GIT_COMMIT_HASH:-unknown}
    environment:
      - GIT_COMMIT_HASH=${GIT_COMMIT_HASH:-unknown} 
    container_name: backend
    restart: unless-stopped
    volumes:
      - static_volume:/app/static
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - static_volume:/static
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    logging:
      driver: "none"
    container_name: pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  pgadmin_data:
  static_volume:

networks:
  app_network:
