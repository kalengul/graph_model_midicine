services:
  db:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 0s 
    container_name: db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  backend:
    container_name: backend
    build: 
      context: ./backend
      args:
        - GIT_COMMIT_HASH=${GIT_COMMIT_HASH:-unknown}
    environment:
      - GIT_COMMIT_HASH=${GIT_COMMIT_HASH:-unknown} 
      - USE_SQLITE=False
      - POSTGRES_HOST=db
    restart: unless-stopped
    volumes:
      - static_volume:/app/static
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - static_volume:/static
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data:
  static_volume:
  logs:
