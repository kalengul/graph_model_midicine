server {
    listen 80 default_server;
    server_name 158.160.151.7;
    return 301 http://polifarmacy.rea.ru$request_uri;
}

server {
    listen 80;
    server_name polifarmacy.rea.ru;
    root  /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;

    resolver 127.0.0.11 valid=30s;

    location / {
        try_files $uri /index.html;
    }

    location = /health {
        return 301 /health/;
    }

    location /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host $host;
        access_log off;
    }
    
    location /api/ {
        rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mini-front-manager/ {
        alias /usr/share/nginx/html/mini-front-manager/;
        try_files $uri $uri/ /mini-front-manager/index.html;
    }

    location /static/ {
        alias /static/;
        access_log off;
        expires 1h;
    }

    location /media/ {
        alias /media/;
        access_log off;
    }
}
